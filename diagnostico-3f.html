<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico O Plano 2027 · 3F Escola de Negócios</title>
<meta name="description" content="Diagnóstico de marca, vendas e marketing para o O Plano 2027, da 3F Escola de Negócios. Cerca de 10 minutos.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#26272b">
<meta property="og:title" content="Diagnóstico O Plano 2027 · 3F Escola de Negócios">
<meta property="og:description" content="Marca, vendas e marketing: o ponto de partida da sua empresa, em cerca de 10 minutos.">
<link rel="preload" href="fonts/3f/mozilla-text-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/3f/mozilla-text-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Mozilla Text";src:url(fonts/3f/mozilla-text-latin-300-normal.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Mozilla Text";src:url(fonts/3f/mozilla-text-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Mozilla Text";src:url(fonts/3f/mozilla-text-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Mozilla Text";src:url(fonts/3f/mozilla-text-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Mozilla Text";src:url(fonts/3f/mozilla-text-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
/* 3F · paleta Grafite: fundo chapado, tinta branca, um único destaque laranja */
:root{--fundo:#26272b;--tinta:#fff;--suave:rgba(255,255,255,.62);--traco:rgba(255,255,255,.6);--guia:rgba(255,255,255,.18);--laranja:#ff6b1a;--f:"Mozilla Text",system-ui,-apple-system,"Segoe UI",sans-serif;--m:clamp(20px,5vw,80px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--fundo);color:var(--tinta);font-family:var(--f);font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;background-image:radial-gradient(rgba(255,255,255,.9) .6px,transparent .7px);background-size:5px 5px}
button,input,textarea{font-family:inherit;color:inherit}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 var(--m)}
.top{position:fixed;left:0;right:0;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);background:var(--fundo)}
.top .wrap{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:baseline;gap:12px;text-decoration:none;color:var(--tinta)}
.logo b{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.logo span{font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--suave)}
.sec{font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--suave);text-align:right}
.sec b{color:var(--laranja);font-weight:600}
.bar{position:fixed;left:0;right:0;top:calc(72px + env(safe-area-inset-top,0px));height:4px;background:var(--guia);z-index:10}
.bar i{display:block;height:100%;width:0;background:var(--laranja);transition:width .5s ease}
main{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:120px 0}
.q{max-width:860px;animation:qin .6s cubic-bezier(.2,.7,.2,1) both}
.q.back{animation-name:qinb}
@keyframes qin{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes qinb{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
.rot{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--suave);margin-bottom:22px}
.rot b{color:var(--laranja);font-weight:600}
.selo{display:inline-block;font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--laranja);border:2px solid var(--laranja);border-radius:27px;padding:10px 20px;margin-bottom:28px}
h1,h2{font-weight:600;letter-spacing:-.02em;line-height:1.08}
h1{font-size:clamp(36px,5.6vw,72px)}
h2{font-size:clamp(28px,4vw,52px)}
h1 em,h2 em{font-style:normal;color:var(--laranja)}
.help{font-size:clamp(17px,1.7vw,21px);line-height:1.5;color:var(--suave);margin-top:18px;max-width:40em}
.field{margin-top:36px}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;font-size:clamp(20px,2.3vw,28px);font-weight:400;line-height:1.35;background:transparent;border:0;border-bottom:2px solid var(--traco);padding:10px 0;outline:none;border-radius:0;resize:none}
textarea{min-height:110px}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.35)}
input:focus,textarea:focus{border-color:var(--laranja)}
.opts{display:grid;gap:10px;margin-top:32px;max-width:640px}
.opts.cols{grid-template-columns:repeat(2,minmax(0,1fr));max-width:860px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-size:18px;font-weight:500;line-height:1.3;background:transparent;border:2px solid var(--guia);border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .25s,background .25s,transform .15s}
.opt:hover{border-color:var(--traco)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:1.4px solid var(--traco);display:grid;place-items:center;font-size:13px;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--laranja);background:rgba(255,107,26,.12)}
.opt[aria-pressed="true"] .k{background:var(--laranja);border-color:var(--laranja);color:#000}
.opt.flash{transform:scale(.98)}
.scale{display:flex;flex-wrap:wrap;gap:8px;margin-top:32px}
.scale .opt{width:56px;height:56px;justify-content:center;padding:0;font-size:19px}
.scale-l{display:flex;justify-content:space-between;max-width:640px;margin-top:10px;font-size:14px;color:var(--suave)}
.other{margin-top:12px;max-width:640px}
.other input{font-size:18px!important}
.act{display:flex;align-items:center;gap:18px;margin-top:36px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:12px;font-size:16px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#000;background:var(--tinta);border:0;border-radius:48px;padding:16px 28px;cursor:pointer;text-decoration:none;transition:background .25s,transform .15s}
.btn:hover{background:var(--laranja)}
.btn svg{width:16px;height:16px}
.hint{font-size:14px;color:var(--suave)}
.hint kbd{font:600 12px var(--f);border:1px solid var(--traco);border-radius:6px;padding:2px 6px}
.err{margin-top:14px;font-size:15px;font-weight:500;color:#ffb38a}
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:44px;max-width:860px}
.parts div{border-top:4px solid var(--guia);padding-top:14px}
.parts div:first-child{border-color:var(--laranja)}
.parts b{display:block;font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
.parts span{display:block;margin-top:6px;font-size:15px;line-height:1.4;color:var(--suave)}
.send{display:block;width:100%;max-width:640px;margin-top:40px;font-size:clamp(20px,2.4vw,26px);font-weight:700;letter-spacing:3px;text-transform:uppercase;text-align:center;color:#000;background:var(--laranja);border:0;border-radius:48px;padding:30px 32px;cursor:pointer;text-decoration:none;transition:transform .15s,background .25s}
.send:hover{background:#fff;transform:translateY(-2px)}
.note{margin-top:16px;max-width:640px;font-size:15px;line-height:1.5;color:var(--suave)}
.note a,.note button{background:none;border:0;padding:0;color:var(--tinta);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit}
.ok{margin-top:10px;font-size:14px;color:var(--laranja);min-height:1.2em}
.nav-q{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:6px}
.nav-q button{width:46px;height:46px;border-radius:14px;border:2px solid var(--guia);background:var(--fundo);cursor:pointer;display:grid;place-items:center}
.nav-q button:hover:not(:disabled){border-color:var(--tinta)}
.nav-q button:disabled{opacity:.3;cursor:default}
.nav-q svg{width:14px;height:14px}
@media (max-width:700px){
  .opts.cols{grid-template-columns:minmax(0,1fr)}
  .parts{grid-template-columns:minmax(0,1fr);gap:14px}
  .scale .opt{width:44px;height:44px;font-size:16px}
  .hint{display:none}
  main{align-items:flex-start;padding-top:104px}
  .opt{font-size:16px}
  .logo span{display:none}
}
@media (prefers-reduced-motion:reduce){.q{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="arr" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M4 12h15M13 6l6 6-6 6"/></symbol>
<symbol id="chev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></symbol>
</defs></svg>
<header class="top"><div class="wrap">
  <span class="logo" aria-label="3F Escola de Negócios"><b>3F</b><span>Escola de Negócios</span></span>
  <div class="sec" id="sec" aria-live="polite"></div>
</div></header>
<div class="bar" aria-hidden="true"><i id="bar"></i></div>
<main><div class="wrap" id="stage"></div></main>
<div class="nav-q"><button type="button" id="prevQ" aria-label="Pergunta anterior"><svg style="transform:rotate(-90deg)"><use href="#chev"/></svg></button><button type="button" id="nextQ" aria-label="Próxima pergunta"><svg style="transform:rotate(90deg)"><use href="#chev"/></svg></button></div>

<script>
/* ---------- Roteiro ---------- */
const EMAIL='kaue@cooltivo.com.br';
const SECS={sobre:'A empresa',vendas:'Vendas',mkt:'Marketing',marca:'Marca',fim:'Contato'};
const Q=[
 {t:'intro'},
 {t:'section',s:'sobre',title:'Primeiro, <em>a empresa.</em>',help:'Algumas perguntas rápidas para contextualizar.'},
 {id:'nome',s:'sobre',t:'text',title:'Qual é o seu nome?',ph:'Seu nome',req:1},
 {id:'empresa',s:'sobre',t:'text',title:'Qual é o nome da empresa, {nome}?',ph:'Nome da empresa',req:1},
 {id:'cargo',s:'sobre',t:'choice',title:'Qual é o seu papel na {empresa}?',opts:['Fundador ou sócio','Diretor','Gerente','Outro'],other:1,req:1},
 {id:'segmento',s:'sobre',t:'choice',title:'Em qual segmento a {empresa} atua?',opts:['Indústria','Serviços B2B','Varejo e e-commerce','Agronegócio','Vinícola, alimentos e bebidas','Construção e imobiliário','Saúde','Outro'],other:1,cols:1,req:1},
 {id:'porte',s:'sobre',t:'choice',title:'Quantas pessoas trabalham na empresa?',opts:['Até 10','De 11 a 50','De 51 a 200','Mais de 200'],req:1},

 {t:'section',s:'vendas',tag:'Parte 1 de 3 · Vendas',title:'Os <em>números</em> da venda.',help:'Se tiver os números à mão, melhor. Se não souber algum, responda "não sei": isso também é um diagnóstico.'},
 {id:'fat12',s:'vendas',t:'text',title:'Quanto a {empresa} vendeu nos últimos 12 meses?',help:'Faturamento bruto, valor aproximado.',ph:'Ex.: R$ 14 milhões',req:1},
 {id:'formato',s:'vendas',t:'multi',title:'Como a empresa vende hoje?',help:'Marque todos os formatos que se aplicam.',opts:['Venda direta com time comercial','Representantes comerciais','Distribuidores ou revendas','Loja física','E-commerce ou marketplace','Licitação ou grandes contas','Outro'],other:1,cols:1,req:1},
 {id:'tipo',s:'vendas',t:'choice',title:'Para quem a empresa mais vende?',opts:['Para outras empresas (B2B)','Para o consumidor final (B2C)','Para os dois, em partes parecidas'],req:1},
 {id:'equipe',s:'vendas',t:'choice',title:'Quantas pessoas tem a equipe comercial?',help:'Contando vendedores internos, externos e representantes.',opts:['Só eu, o dono','De 1 a 3','De 4 a 10','De 11 a 30','Mais de 30'],req:1},
 {id:'gestor',s:'vendas',t:'choice',title:'Quem faz a gestão do time de vendas?',opts:['Eu, o dono','Um gestor comercial dedicado','Ninguém de forma clara'],req:1},
 {id:'ticket',s:'vendas',t:'text',title:'Qual é o ticket médio de uma venda?',ph:'Ex.: R$ 8 mil, ou "não sei"',req:1},
 {id:'ciclo',s:'vendas',t:'choice',title:'Quanto tempo leva, em média, do primeiro contato até fechar uma venda?',opts:['Fecha no mesmo dia','Até 1 semana','De 1 a 4 semanas','De 1 a 3 meses','De 3 a 6 meses','Mais de 6 meses','Não sei'],cols:1,req:1},
 {id:'cac',s:'vendas',t:'choice',title:'Você sabe quanto custa conquistar um cliente novo (CAC)?',help:'Tudo o que se investe em marketing e vendas dividido pelo número de clientes novos no período.',opts:['Sei o número exato','Tenho uma ideia aproximada','Não sei'],req:1,follow:{when:['Sei o número exato','Tenho uma ideia aproximada'],id:'cac_valor',ph:'Quanto? Ex.: R$ 1.200 por cliente'}},
 {id:'retencao',s:'vendas',t:'choice',title:'Quanto tempo, em média, um cliente continua comprando da {empresa}?',opts:['Compra uma vez só','Menos de 1 ano','De 1 a 3 anos','De 3 a 5 anos','Mais de 5 anos','Não sei'],cols:1,req:1},
 {id:'clientes',s:'vendas',t:'text',title:'Quantos clientes ativos a empresa tem hoje?',help:'Clientes que compraram nos últimos 12 meses.',ph:'Ex.: 320, ou "não sei"',req:1},
 {id:'curva',s:'vendas',t:'choice',title:'Curva ABC: quanto do faturamento vem dos 20% maiores clientes?',opts:['Menos de 50%','De 50% a 70%','De 70% a 90%','Mais de 90%','Não sei'],req:1},
 {id:'perfil',s:'vendas',t:'long',title:'Descreva o seu melhor cliente.',help:'Segmento, porte, cidade ou região, quem decide a compra e por que ele dá certo com vocês.',ph:'Quem é o cliente que você queria ter mais',req:1},
 {id:'crm',s:'vendas',t:'choice',title:'Como o time acompanha as vendas e as negociações?',opts:['Num CRM (RD, Pipedrive, HubSpot ou outro)','Em planilha','No WhatsApp e na cabeça de cada vendedor','Não acompanhamos'],cols:1,req:1},

 {t:'section',s:'mkt',tag:'Parte 2 de 3 · Marketing',title:'A <em>estrutura</em> de marketing.',help:'Para entender quem faz, quanto se investe e como é medido hoje.'},
 {id:'quem',s:'mkt',t:'choice',title:'Tem alguém cuidando do marketing hoje?',opts:['Ninguém dedicado','Eu mesmo, junto com outras funções','Uma pessoa interna','Um time interno, com gestor','Só a agência ou freelancers'],cols:1,req:1},
 {id:'invest',s:'mkt',t:'choice',title:'Quanto a empresa investe por mês em marketing?',help:'Somando equipe, agência, produção e mídia paga.',opts:['Até R$ 5 mil','De R$ 5 a 15 mil','De R$ 15 a 30 mil','De R$ 30 a 60 mil','Acima de R$ 60 mil','Não sei dizer'],cols:1,req:1},
 {id:'midia',s:'mkt',t:'choice',title:'E quanto disso vai para mídia paga (Google, Meta, LinkedIn)?',opts:['Nada','Até R$ 3 mil','De R$ 3 a 10 mil','De R$ 10 a 30 mil','Acima de R$ 30 mil','Não sei'],cols:1,req:1},
 {id:'agencia_hist',s:'mkt',t:'choice',title:'A empresa já trabalhou com agência?',opts:['Nunca','Já trabalhou, mas não trabalha mais','Trabalha com agência hoje'],req:1},
 {id:'agencia_fmt',s:'mkt',t:'multi',title:'Que tipo de agência ou parceiro de marketing a empresa tem ou teve?',help:'Marque todos que se aplicam.',opts:['Agência completa (full service)','Tráfego pago e performance','Social media e conteúdo','Branding e design','Assessoria de imprensa','Freelancers','Consultoria','Nenhum'],cols:1,req:1,skip:()=>A.agencia_hist==='Nunca'},
 {id:'agencia_nota',s:'mkt',t:'scale',title:'De 0 a 10, quanto a agência atual gera resultado para o negócio?',lo:'Nenhum',hi:'Muito',req:1,skip:()=>A.agencia_hist!=='Trabalha com agência hoje'},
 {id:'canais',s:'mkt',t:'multi',title:'De onde vêm os clientes novos hoje?',help:'Marque os principais.',opts:['Indicação','Representantes e vendedores na rua','Instagram','LinkedIn','Google (site e anúncios)','Feiras e eventos','WhatsApp e lista própria','Prospecção ativa','Outro'],other:1,cols:1,req:1},
 {id:'medicao',s:'mkt',t:'choice',title:'Você sabe quantos clientes o marketing trouxe no último mês?',opts:['Sim, medimos isso','Mais ou menos','Não medimos'],req:1},

 {t:'section',s:'marca',tag:'Parte 3 de 3 · Marca',title:'O <em>valor</em> da marca.',help:'Marca forte diminui o custo de conquistar clientes e sustenta o preço.'},
 {id:'porque',s:'marca',t:'long',title:'Por que um cliente escolhe a {empresa} e não o concorrente?',ph:'O motivo real, na visão de quem compra',req:1},
 {id:'concorrentes',s:'marca',t:'text',title:'Quem são os 3 principais concorrentes?',ph:'Nomes',req:0},
 {id:'preco',s:'marca',t:'choice',title:'Nas negociações, o preço costuma ser o assunto principal?',opts:['Quase sempre','Às vezes','Raramente'],req:1},
 {id:'nota_marca',s:'marca',t:'scale',title:'De 0 a 10, o quanto a marca de hoje mostra o que a empresa é de verdade?',lo:'Nada a ver',hi:'Representa muito bem',req:1},
 {id:'posic',s:'marca',t:'choice',title:'A empresa tem um posicionamento de marca definido e escrito?',opts:['Sim, e o time sabe explicar','Sim, mas ficou no papel','Não'],req:1},
 {id:'lembrada',s:'marca',t:'text',title:'Em 3 palavras, como você quer que a marca seja lembrada?',ph:'Ex.: confiável, inovadora, próxima',req:1},
 {id:'desafio',s:'marca',t:'long',title:'Qual é o maior desafio da {empresa} para 2027?',help:'Com suas palavras. É a pergunta mais importante do diagnóstico.',ph:'O que precisa mudar ou acontecer',req:1},

 {t:'section',s:'fim',title:'Quase lá, <em>{nome}.</em>',help:'Só o contato, para a gente conversar sobre o diagnóstico.'},
 {id:'whats',s:'fim',t:'tel',title:'Qual é o seu WhatsApp?',ph:'(54) 9 0000-0000',req:1},
 {id:'email',s:'fim',t:'email',title:'E o seu e-mail?',ph:'nome@empresa.com.br',req:1},
 {t:'done'}
];

/* ---------- Estado (salvo neste navegador para não perder respostas) ---------- */
const KEY='3f-diagnostico-2027-v1';
let A={},i=0;
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');A=s.A||{};i=Math.min(s.i||0,Q.length-1)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({A,i}))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fill=t=>t.replace(/\{(\w+)\}/g,(_,k)=>esc((A[k]||'').toString().trim()||({nome:'',empresa:'sua empresa'}[k]??''))).replace(/,\s*\?/,'?').replace(/\s+\?/,'?').replace(/\s+\./,'.').replace(/\s+<\/em>/,'</em>');
const stage=document.getElementById('stage'),bar=document.getElementById('bar'),sec=document.getElementById('sec');
const L='ABCDEFGHIJKLMNOP';
const active=q=>!(q.skip&&q.skip());
const answerable=()=>Q.filter(q=>q.id&&active(q));
const has=v=>!(v===undefined||v===''||(Array.isArray(v)&&!v.length));

function render(dir){
  const q=Q[i],aq=answerable();
  const done=aq.filter(x=>has(A[x.id])).length;
  bar.style.width=(q.t==='done'?(SENT===sig()?100:96):Math.round(done/aq.length*100))+'%';
  sec.innerHTML=q.t==='done'?(SENT===sig()?'<b>Enviado</b>':'<b>Enviando</b>'):q.s?`<b>${SECS[q.s]}</b>`:'O Plano 2027';
  document.getElementById('prevQ').disabled=i===0;
  document.getElementById('nextQ').disabled=q.t==='done';
  let h='';
  const n=q.id?aq.indexOf(q)+1:0;
  const head=!q.title?'':`<div class="rot"><b>${String(n).padStart(2,'0')}</b><span>de ${aq.length}</span></div><h2>${fill(q.title)}</h2>${q.help?`<p class="help">${fill(q.help)}</p>`:''}`;
  if(q.t==='intro'){
    h=`<div class="q"><span class="selo">O Plano 2027 · Diagnóstico</span><h1>Marca, vendas e marketing: <em>o ponto de partida</em> da sua empresa.</h1>
      <p class="help">Responda antes do evento. Leva cerca de 10 minutos e ajuda a gente a chegar no sábado entendendo o seu negócio. Se tiver os números de vendas à mão, melhor.</p>
      <div class="parts"><div><b>Vendas</b><span>Faturamento, ciclo, CAC, ticket e clientes</span></div><div><b>Marketing</b><span>Estrutura, investimento e agência</span></div><div><b>Marca</b><span>Diferença, preço e o desafio de 2027</span></div></div>
      <div class="act"><button class="btn" type="button" data-next>${Object.keys(A).length?'Continuar de onde parei':'Começar'} <svg><use href="#arr"/></svg></button><span class="hint">ou aperte <kbd>Enter ↵</kbd></span></div></div>`;
  }else if(q.t==='section'){
    h=`<div class="q">${q.tag?`<span class="selo">${q.tag}</span>`:''}<h1>${fill(q.title)}</h1>${q.help?`<p class="help">${fill(q.help)}</p>`:''}
      <div class="act"><button class="btn" type="button" data-next>Continuar <svg><use href="#arr"/></svg></button><span class="hint">ou aperte <kbd>Enter ↵</kbd></span></div></div>`;
  }else if(['text','long','tel','email'].includes(q.t)){
    const v=esc(A[q.id]||'');
    const inp=q.t==='long'?`<textarea id="inp" rows="3" placeholder="${q.ph||''}">${v}</textarea>`:`<input id="inp" type="${q.t==='text'?'text':q.t}" placeholder="${q.ph||''}" value="${v}" autocomplete="${{nome:'name',empresa:'organization',whats:'tel',email:'email'}[q.id]||'off'}">`;
    h=`<div class="q">${head}<div class="field">${inp}</div><p class="err" id="err" hidden></p>
      <div class="act"><button class="btn" type="button" data-next>OK <svg><use href="#arr"/></svg></button><span class="hint">${q.t==='long'?'<kbd>Shift</kbd> + <kbd>Enter ↵</kbd> para quebrar linha':'aperte <kbd>Enter ↵</kbd>'}</span></div></div>`;
  }else if(q.t==='choice'||q.t==='multi'){
    const sel=q.t==='multi'?(A[q.id]||[]):[A[q.id]];
    const opts=q.opts.map((o,k)=>`<button type="button" class="opt" data-o="${esc(o)}" aria-pressed="${sel.includes(o)}"><span class="k">${L[k]}</span>${esc(o)}</button>`).join('');
    const showO=q.other&&sel.some(s=>/^Outr[oa]$/.test(s));
    const oth=q.other?`<div class="other" ${showO?'':'hidden'} id="othW"><input id="oth" type="text" placeholder="Qual?" value="${esc(A[q.id+'_outro']||'')}"></div>`:'';
    const showF=q.follow&&q.follow.when.includes(A[q.id]);
    const fol=q.follow?`<div class="other" ${showF?'':'hidden'} id="folW"><input id="fol" type="text" placeholder="${q.follow.ph}" value="${esc(A[q.follow.id]||'')}"></div>`:'';
    h=`<div class="q">${head}<div class="opts ${q.cols?'cols':''}">${opts}</div>${oth}${fol}<p class="err" id="err" hidden></p>
      ${q.t==='multi'||q.other||q.follow?`<div class="act"><button class="btn" type="button" data-next>OK <svg><use href="#arr"/></svg></button><span class="hint">aperte <kbd>Enter ↵</kbd></span></div>`:''}</div>`;
  }else if(q.t==='scale'){
    const opts=[...Array(11).keys()].map(k=>`<button type="button" class="opt" data-o="${k}" aria-pressed="${A[q.id]===k}">${k}</button>`).join('');
    h=`<div class="q">${head}<div class="scale">${opts}</div><div class="scale-l"><span>${q.lo}</span><span>${q.hi}</span></div><p class="err" id="err" hidden></p></div>`;
  }else if(q.t==='done'){
    h=doneHTML();
  }
  stage.innerHTML=h;
  const qe=stage.querySelector('.q');if(dir<0)qe.classList.add('back');
  const inp=document.getElementById('inp');if(inp){inp.focus({preventScroll:true});if(inp.tagName==='TEXTAREA'){inp.selectionStart=inp.value.length;grow(inp);inp.addEventListener('input',()=>grow(inp))}}
  stage.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',next));
  stage.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>pick(b)));
  const oth=document.getElementById('oth');if(oth)oth.addEventListener('input',()=>{A[q.id+'_outro']=oth.value;save()});
  const fol=document.getElementById('fol');if(fol)fol.addEventListener('input',()=>{A[q.follow.id]=fol.value;save()});
  if(q.t==='done')autoSend();
  window.scrollTo(0,0);
}
const ok=t=>{document.getElementById('ok').textContent=t};
const grow=t=>{t.style.height='auto';t.style.height=Math.max(110,t.scrollHeight)+'px'};
function err(t){const e=document.getElementById('err');if(e){e.textContent=t;e.hidden=false}}
function pick(b){
  const q=Q[i],o=b.dataset.o;
  if(q.t==='scale'){A[q.id]=+o;save();stage.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));b.classList.add('flash');setTimeout(next,260);return}
  if(q.t==='choice'){
    A[q.id]=o;save();stage.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));
    const w=document.getElementById('othW'),f=document.getElementById('folW');
    if(q.other&&/^Outr[oa]$/.test(o)){w.hidden=false;document.getElementById('oth').focus();return}
    if(w)w.hidden=true;
    if(q.follow){const show=q.follow.when.includes(o);f.hidden=!show;if(show){document.getElementById('fol').focus();return}}
    b.classList.add('flash');setTimeout(next,260);return}
  let s=A[q.id]||[];
  if(s.includes(o))s=s.filter(x=>x!==o);
  else{
    if(/^Nenhum/.test(o))s=[o];else{s=s.filter(x=>!/^Nenhum/.test(x));if(q.max&&s.length>=q.max){err(`Escolha no máximo ${q.max}. Desmarque uma para trocar.`);return}s.push(o)}
  }
  A[q.id]=s;save();
  stage.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',s.includes(x.dataset.o)));
  const w=document.getElementById('othW');if(w){w.hidden=!s.some(x=>/^Outr[oa]$/.test(x));if(!w.hidden&&/^Outr[oa]$/.test(o))document.getElementById('oth').focus()}
  const e=document.getElementById('err');if(e)e.hidden=true;
}
function valid(){
  const q=Q[i];if(!q.id)return true;
  const inp=document.getElementById('inp');
  if(inp){A[q.id]=inp.value.trim();save()}
  const v=A[q.id];
  if(q.req&&!has(v)){err(q.t==='multi'||q.t==='choice'||q.t==='scale'?'Escolha uma opção para continuar.':'Responda para continuar.');return false}
  if(q.t==='email'&&!/^\S+@\S+\.\S+$/.test(v)){err('Confira o e-mail: parece incompleto.');return false}
  if(q.t==='tel'&&v.replace(/\D/g,'').length<10){err('Confira o número com DDD.');return false}
  return true;
}
function step(d){let j=i+d;while(j>0&&j<Q.length-1&&Q[j].id&&!active(Q[j]))j+=d;return j}
function next(){if(!valid())return;if(i<Q.length-1){i=step(1);save();render(1)}}
function prev(){if(i>0){const inp=document.getElementById('inp');if(inp&&Q[i].id){A[Q[i].id]=inp.value.trim()}i=step(-1);save();render(-1)}}
document.getElementById('prevQ').onclick=prev;
document.getElementById('nextQ').onclick=next;
document.addEventListener('keydown',e=>{
  const q=Q[i];
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){if(e.target.classList&&e.target.classList.contains('opt')){e.preventDefault();next();return}if(e.target.tagName==='BUTTON'||e.target.tagName==='A')return;e.preventDefault();next();return}
  if((q.t==='choice'||q.t==='multi')&&!/INPUT|TEXTAREA/.test(e.target.tagName)&&e.key.length===1){
    const k=L.indexOf(e.key.toUpperCase());const b=stage.querySelectorAll('.opt')[k];if(b)pick(b)}
  if(q.t==='scale'&&!/INPUT|TEXTAREA/.test(e.target.tagName)&&/^[0-9]$/.test(e.key)){const b=stage.querySelectorAll('.opt')[+e.key];if(b)pick(b)}
});

/* ---------- E-mail com as respostas ---------- */
function val(id){const q=Q.find(x=>x.id===id),v=A[id];if(!has(v))return '-';
  let t=Array.isArray(v)?v.join(', '):String(v);const o=(A[id+'_outro']||'').trim();if(o)t=t.replace(/\bOutr[oa]\b/,'Outro: '+o);
  if(q&&q.follow&&has(A[q.follow.id]))t+=' ('+A[q.follow.id]+')';
  return q&&q.t==='scale'?t+'/10':t}
const short={nome:'Nome',empresa:'Empresa',cargo:'Papel',segmento:'Segmento',porte:'Pessoas na empresa',fat12:'Vendas nos últimos 12 meses',formato:'Formato de venda',tipo:'Vende para',equipe:'Equipe comercial',gestor:'Gestão de vendas',ticket:'Ticket médio',ciclo:'Ciclo de venda',cac:'Conhece o CAC',retencao:'Tempo médio do cliente',clientes:'Clientes ativos',curva:'Curva ABC (20% maiores clientes)',perfil:'Melhor cliente',crm:'Acompanhamento das vendas',quem:'Quem faz o marketing',invest:'Investimento mensal em marketing',midia:'Mídia paga por mês',agencia_hist:'Agência',agencia_fmt:'Tipo de agência ou parceiro',agencia_nota:'Resultado da agência atual',canais:'De onde vêm os clientes novos',medicao:'Mede clientes vindos do marketing',porque:'Por que escolhem a empresa',concorrentes:'Principais concorrentes',preco:'Preço domina a negociação',nota_marca:'A marca mostra a empresa',posic:'Posicionamento definido',lembrada:'Como quer ser lembrada',desafio:'Maior desafio para 2027',whats:'WhatsApp',email:'E-mail'};
function report(){
  const out=[`Diagnóstico O Plano 2027 · ${A.empresa||''}`,''];let cur='';
  Q.forEach(q=>{if(!q.id||!active(q))return;if(q.s!==cur){cur=q.s;out.push('',SECS[cur].toUpperCase())}out.push(`${short[q.id]||q.id}: ${val(q.id)}`)});
  return out.join('\n').trim();
}
function mailto(){return `mailto:${EMAIL}?subject=${encodeURIComponent('Diagnóstico O Plano 2027 · '+(A.empresa||''))}&body=${encodeURIComponent(report())}`}

/* ---------- Envio automático para o e-mail (FormSubmit), com o e-mail manual como reserva ---------- */
const SEND_URL='https://formsubmit.co/ajax/'+EMAIL;
const SHEET_URL=''; /* Google Apps Script (planilha no Drive). Vazio = desligado. */
let SENT='';try{SENT=localStorage.getItem(KEY+'-sent')||''}catch(e){}
function sig(){const t=report();let h=0;for(let k=0;k<t.length;k++)h=(h*31+t.charCodeAt(k))|0;return String(h)}
let state='idle';
function doneHTML(){
  if(SENT===sig()||state==='ok')return `<div class="q"><span class="selo">Diagnóstico enviado</span><h1>Pronto, <em>${esc(A.nome||'')}</em>.</h1>
    <p class="help">Recebemos as suas respostas. Elas vão ajudar a gente a chegar no sábado entendendo o momento da ${esc(A.empresa||'sua empresa')}. Pode fechar esta página.</p></div>`;
  if(state==='fail')return `<div class="q"><span class="selo">Último passo · ainda não acabou</span><h1>${esc(A.nome||'')}, falta <em>enviar.</em></h1>
    <p class="help"><strong style="color:#fff;font-weight:600">Não conseguimos enviar automaticamente.</strong> Toque no botão abaixo: o seu e-mail vai abrir com tudo preenchido. Depois, é só tocar em enviar no e-mail.</p>
    <a class="send" id="send" href="${mailto()}">Enviar minhas respostas</a>
    <p class="note">O e-mail não abriu? <button type="button" id="copy">Copie as respostas</button> e mande para ${EMAIL}.</p>
    <p class="ok" id="ok"></p></div>`;
  return `<div class="q"><span class="selo">Enviando</span><h1>Enviando as suas <em>respostas…</em></h1>
    <p class="help">Só um instante. Não feche esta página.</p></div>`;
}
function paint(){stage.innerHTML=doneHTML();bar.style.width=(state==='ok'?100:96)+'%';sec.innerHTML=state==='ok'?'<b>Enviado</b>':state==='fail'?'<b>Falta enviar</b>':'<b>Enviando</b>';
  const sd=document.getElementById('send');if(sd)sd.addEventListener('click',()=>setTimeout(()=>ok('Abriu o seu e-mail? Agora toque em enviar por lá. Só assim as respostas chegam.'),400));
  const cp=document.getElementById('copy');if(cp)cp.onclick=()=>{const t=report();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>ok('Respostas copiadas. Cole no e-mail para '+EMAIL+'.')).catch(()=>ok('Não consegui copiar. Tente pelo botão de enviar.'))};}
function autoSend(){
  if(SENT===sig()){state='ok';paint();return}
  state='sending';paint();
  const data={_subject:'Diagnóstico O Plano 2027 · '+(A.empresa||''),_template:'box',_captcha:'false',_replyto:A.email||''};
  Q.forEach(q=>{if(q.id&&active(q))data[short[q.id]||q.id]=val(q.id)});
  const sheet=SHEET_URL?fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}).then(()=>true).catch(()=>false):Promise.resolve(false);
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),15000);
  fetch(SEND_URL,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(data),signal:ctl.signal})
   .then(r=>r.json().catch(()=>({})).then(j=>({r,j})))
   .then(({r,j})=>r.ok&&String(j.success)==='true').catch(()=>false)
   .then(mail=>sheet.then(sh=>{clearTimeout(to);if(mail||sh){SENT=sig();try{localStorage.setItem(KEY+'-sent',SENT)}catch(e){}state='ok'}else state='fail';if(Q[i].t==='done')paint()}));
}

render(0);
</script>
